name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: compose ファイルの検証
        run: |
          cp .env.example .env
          sed -i 's/^WEB_PASS_HASH=.*/WEB_PASS_HASH=x/; s/^API_MQTT_PASS=.*/API_MQTT_PASS=x/; s/^DB_PASSWORD=.*/DB_PASSWORD=x/' .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.b.yaml config --quiet
          docker compose -f compose.b.yaml -f compose.prebuilt.yaml config --quiet
      - name: シェルスクリプトの検証
        run: |
          for f in scripts/*.sh e2e/*.sh; do bash -n "$f"; done
          shellcheck -S warning -x scripts/*.sh e2e/*.sh
      - name: VM の初期設定スクリプト(2 回実行しても壊れないか)
        run: |
          python3 -c "import yaml,sys; d=yaml.safe_load(open('deploy/oracle-cloud-init.yaml')); assert 'runcmd' in d"
          head -1 deploy/oracle-cloud-init.yaml | grep -qx '#cloud-config'
          sudo REPO_URL="$PWD" bash scripts/bootstrap-ubuntu.sh runner
          sudo REPO_URL="$PWD" bash scripts/bootstrap-ubuntu.sh runner
          sudo iptables -C INPUT -p tcp -m state --state NEW --dport 443 -j ACCEPT
          test -d ~/map-tracking/.git
      - name: Caddyfile の検証
        run: |
          for f in Caddyfile Caddyfile.b; do
            docker run --rm -e MQTT_DOMAIN=mqtt.example.com -e APP_DOMAIN=map.example.com \
              -e ACME_EMAIL=you@example.net -e WEB_USER=admin \
              -e 'WEB_PASS_HASH=$2b$10$Tsv1Vor0dU5GjjrUig2nYuINKmOfutVHqerSeUyu9ZJdtO3bvY.6i' \
              -v "$PWD/caddy/$f:/etc/caddy/Caddyfile:ro" caddy:2.11.9 caddy validate --config /etc/caddy/Caddyfile
          done
      - name: Mosquitto 設定の検証
        run: |
          docker run --rm -v "$PWD/mosquitto/config:/mosquitto/config" eclipse-mosquitto:2.0.23 sh -c \
            'mosquitto_passwd -c -b /tmp/passwd api x && chown mosquitto /tmp/passwd && sed "s#/mosquitto/config/passwd#/tmp/passwd#" /mosquitto/config/mosquitto.conf > /tmp/m.conf && mosquitto -c /tmp/m.conf & pid=$!; sleep 3; kill -0 $pid'
      - name: API イメージのビルド
        run: docker build -f api/Dockerfile -t map-tracking-api:ci .

  # 構成一式を起動し、スマホと同じ経路(WSS → Caddy → Mosquitto → API)で通しテストする
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - run: bash e2e/run.sh
      - name: 失敗したときのログ
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --tail=200 || true

  # main に入ったら、API のイメージを GitHub Container Registry に公開する(amd64 / arm64)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, compose, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: arm64 のビルド環境を用意
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name multi
      - name: ログイン
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: ビルドして公開
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}-api
          docker buildx build --platform linux/amd64,linux/arm64 -f api/Dockerfile             -t "$image:main" -t "$image:sha-${GITHUB_SHA::7}" --push .
