persistence true
persistence_location /mosquitto/data/
# ログは標準出力だけに出す(Docker のログとして回される)
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# 全リスナー共通の認証設定にする
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# OwnTracks のメッセージは数 KB。大きすぎるパケットは切断する(認証前の接続を含む)
max_packet_size 262144
# 1 クライアントが未確認のまま溜められるメッセージ数
max_queued_messages 5000

# Recorder 用(Docker 内部ネットワークのみ)
listener 1883

# OwnTracks 用 WebSocket(Caddy が TLS を終端して中継)
listener 9001
protocol websockets
